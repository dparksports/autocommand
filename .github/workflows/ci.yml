# ci.yml - the push/PR tripwire. Same house pattern as release.yml
# (setup-dotnet, windows-latest, pwsh steps) — release.yml stays the
# tag-triggered packaging path; this file gates every push so a broken
# master cannot sit unnoticed until release day.
#
# Strict: the suites whose inputs are fully synthetic — they must pass
# on a stock runner, always.
# Advisory (continue-on-error): the two suites that read live OS
# channels (SiteDoctor's per-edge probes, TaskAttribution's Task
# Scheduler log) — a stock runner can legitimately have them empty.
# Their failures still surface in the job, they just don't gate.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit SHAs (verified against the
      # upstream repos): a floating @v4 tag executes whatever that tag
      # points at tomorrow — a compromised tag would run with this
      # workflow's permissions. Bump deliberately, by verifying the new
      # SHA at https://github.com/actions/<name>/releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Dependency vulnerability scan
        # NU1900 is suppressed for offline builds (Directory.Build.props);
        # this step is the online equivalent that actually gates: any
        # known-vulnerable direct OR transitive package fails the build.
        # (Match the finding phrase, not the table header - the header
        # always carries the word Severity.)
        shell: pwsh
        run: |
          $out = dotnet list AutoCommand.csproj package --vulnerable --include-transitive
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            throw 'Vulnerable packages found - fix before merging'
          }

      - name: Build (Release)
        run: dotnet build AutoCommand.csproj -c Release

      - name: Build (Debug)
        run: dotnet build AutoCommand.csproj -c Debug

      - name: Offline suites (strict)
        shell: pwsh
        run: |
          # 2026.10.30 dead-code sweep removed the BITS/PyTrace/DnsFeed
          # families and their self-tests. RainSelfTest is NOT in this list
          # and must not be: it is a manual visual harness (a WPF window
          # with no exit path and no pass/fail code — the regression signal
          # is a human reading the fps title), so as a gate it hung every
          # run that reached it (both v2026.10.30.17-era runs sat
          # 'in_progress' 30+ minutes). Run it at the desk; the rest gate.
          $suites = @(
            'tests/NetWatchSelfTest',
            'tests/OneSettingsCadenceSelfTest',
            'tests/ContainSelfTest',
            'tests/ProxyInstallSelfTest',
            'tests/BridgeSelfTest',
            'tests/PyTraceSelfTest',
            'tests/InterceptSelfTest',
            'tests/HardenSelfTest',
            'tests/WslSelfTest',
            'tests/StartupHealthSelfTest',
            'tests/AllowListSelfTest',
            'tests/WatchSelfTest',
          )
          foreach ($s in $suites) {
            Write-Host "== $s =="
            dotnet run --project $s
            if ($LASTEXITCODE -ne 0) { throw "$s failed" }
          }

      - name: Live-channel suites (advisory on a stock runner)
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "== SiteDoctorSelfTest =="
          dotnet run --project tests/SiteDoctorSelfTest
          Write-Host "== TaskAttributionSelfTest =="
          dotnet run --project tests/TaskAttributionSelfTest
