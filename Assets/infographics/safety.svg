<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="Built so you can experiment safely: local-first, undo everything, honest about what outlives the folder">
  <rect width="1120" height="500" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">Built so you can experiment</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>
    <text x="56" y="134" font-size="18.5" fill="#94a3b8">A security tool you're afraid to touch is a security tool you won't use.</text>

    <rect x="56" y="164" width="325" height="216" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="208" font-size="21" font-weight="700" fill="#f1f5f9">Local-first</text>
    <g font-size="17.5" fill="#cbd5e1">
      <text x="84" y="250">Everything it records stays</text>
      <text x="84" y="278">on your machine, in</text>
      <text x="84" y="306">readable files.</text>
    </g>

    <rect x="397" y="164" width="325" height="216" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="425" y="208" font-size="21" font-weight="700" fill="#f1f5f9">Undo everything</text>
    <g font-size="17.5" fill="#cbd5e1">
      <text x="425" y="250">Every block reverses in</text>
      <text x="425" y="278">one click. The panic</text>
      <text x="425" y="306">button undoes them all.</text>
    </g>

    <rect x="738" y="164" width="326" height="216" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="766" y="208" font-size="21" font-weight="700" fill="#f1f5f9">Leaving is honest</text>
    <g font-size="17.5" fill="#cbd5e1">
      <text x="766" y="250">Delete the folder and the</text>
      <text x="766" y="278">app's files go — but what it</text>
      <text x="766" y="306">installed into Windows stays.</text>
    </g>

    <rect x="56" y="408" width="1008" height="52" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="440" font-size="16.5" fill="#94a3b8">The way out is built in: the panic button and Settings remove those — Technical Notes lists every location.</text>

    <text x="1064" y="486" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
