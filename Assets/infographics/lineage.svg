<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-label="Where it came from: SystemMonitor, AutoCommand II and III, this repository">
  <rect width="1120" height="420" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">Where it came from</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>

    <line x1="96" y1="220" x2="1024" y2="220" stroke="#334155" stroke-width="3"/>

    <circle cx="146" cy="220" r="11" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
    <text x="146" y="168" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="middle">SystemMonitor</text>
    <text x="146" y="262" font-size="16" fill="#94a3b8" text-anchor="middle">firmware &amp; secure-boot</text>
    <text x="146" y="286" font-size="16" fill="#94a3b8" text-anchor="middle">forensics dashboard</text>

    <circle cx="432" cy="220" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="432" y="168" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="middle">AutoCommand II</text>
    <text x="432" y="262" font-size="16" fill="#94a3b8" text-anchor="middle">engines rebuilt</text>
    <text x="432" y="286" font-size="16" fill="#94a3b8" text-anchor="middle">in F#</text>

    <circle cx="718" cy="220" r="11" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="718" y="168" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="middle">AutoCommand III</text>
    <text x="718" y="262" font-size="16" fill="#94a3b8" text-anchor="middle">watch · contain · harden</text>
    <text x="718" y="286" font-size="16" fill="#94a3b8" text-anchor="middle">takes shape</text>

    <circle cx="976" cy="220" r="13" fill="#22d3ee"/>
    <text x="976" y="168" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="middle">This repository</text>
    <text x="976" y="262" font-size="16" fill="#94a3b8" text-anchor="middle">everything in one</text>
    <text x="976" y="286" font-size="16" fill="#94a3b8" text-anchor="middle">family tree</text>

    <text x="56" y="356" font-size="17" fill="#cbd5e1">The precursor's full source and history live here under systemmonitor/;</text>
    <text x="56" y="382" font-size="17" fill="#cbd5e1">its classic releases stay downloadable on the old Releases page.</text>

    <text x="1064" y="404" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
