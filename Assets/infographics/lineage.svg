<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-label="SystemMonitor, the precursor, to AutoCommand II and III, to AutoCommand today">
<rect width="1120" height="230" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">WHERE IT CAME FROM</text><rect x="64" y="78" width="214" height="84" rx="14" fill="#F5F5F7" stroke="none" stroke-width="1"/><text x="84" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">SystemMonitor</text><text x="84" y="132" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">firmware, UEFI/DBX and</text><text x="84" y="149" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">Defender forensics dashboard</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 284 120 h 18 M 296 113.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="310" y="78" width="214" height="84" rx="14" fill="#F5F5F7" stroke="none" stroke-width="1"/><text x="330" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">AutoCommand II</text><text x="330" y="132" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">the core engines rebuilt in F#</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 530 120 h 18 M 542 113.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="556" y="78" width="214" height="84" rx="14" fill="#F5F5F7" stroke="none" stroke-width="1"/><text x="576" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">AutoCommand III</text><text x="576" y="132" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">the engine stack, hardened and</text><text x="576" y="149" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">split from the shell</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 776 120 h 18 M 788 113.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="802" y="78" width="214" height="84" rx="14" fill="#EAF3FF" stroke="none" stroke-width="1"/><text x="822" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">AutoCommand</text><text x="822" y="132" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">one repository, the whole</text><text x="822" y="149" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">family tree</text><text x="64" y="194" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">The precursor’s complete source tree and commit history live under systemmonitor/ ; its classic v3.x releases remain on the old Releases page.</text>
</g>
</svg>
