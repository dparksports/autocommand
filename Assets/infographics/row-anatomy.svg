<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="336" viewBox="0 0 1120 336" role="img" aria-label="Anatomy of one connection row: who, to whom, how much, how long — plus the right-click menu and the TX-only lens">
<rect width="1120" height="336" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">HOW TO READ ONE ROW</text><rect x="64" y="76" width="992" height="64" rx="12" fill="#F5F5F7" stroke="none" stroke-width="1"/><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="96" cy="106" r="7.5"/><path d="M 101.5 111.5 l 7 7"/></g><text x="130" y="103" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">svchost.exe  →  Google LLC  (schtask → Chrome updater)</text><text x="130" y="124" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">443/tcp · sent 12,401 · received 198,532 · first seen 09:41 · parent: scheduled task</text><rect x="960" y="93" width="72" height="30" rx="15" fill="#0071E3"/><text x="996" y="112" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Block</text><rect x="64" y="168" width="484" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="84" y="198" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Who, and who started it</text><text x="84" y="220" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">the process, its parent, and the scheduled task that launched it</text><rect x="572" y="168" width="484" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="592" y="198" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">To whom, how much, how long</text><text x="592" y="220" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">resolved organization, packet counts both ways, first-seen time</text><rect x="64" y="260" width="484" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="84" y="290" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Right-click asks more</text><text x="84" y="312" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">spawn chain, live sockets, real process name (Sysmon), WSL diagnosis</text><rect x="572" y="260" width="484" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="592" y="290" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">TX-only lens (off by default)</text><text x="592" y="312" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">sent packets and never heard one word back — the shape of a beacon</text>
</g>
</svg>
