<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-label="How to read one connection row: who, to whom, how much, how long, and a Block button with undo">
  <rect width="1120" height="660" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">How to read one row</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>

    <rect x="56" y="128" width="1008" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="102" cy="176" r="10" fill="#34d399"/>
    <text x="128" y="172" font-size="23" font-weight="600" fill="#f1f5f9">chrome.exe</text>
    <text x="128" y="200" font-size="16" fill="#94a3b8">started by your user · signed Google LLC</text>
    <text x="440" y="176" font-size="20" fill="#e2e8f0">→ update.google.com:443</text>
    <text x="440" y="204" font-size="16" fill="#94a3b8">AS15169 Google · RDAP</text>
    <text x="702" y="168" font-size="15.5" fill="#94a3b8">TX 12.4 KB/s</text>
    <rect x="702" y="178" width="150" height="13" rx="6" fill="#0b1220"/>
    <rect x="702" y="178" width="98" height="13" rx="6" fill="#22d3ee"/>
    <text x="702" y="216" font-size="15.5" fill="#94a3b8">RX 2.1 KB/s</text>
    <text x="886" y="176" font-size="17" fill="#e2e8f0">up 42 min</text>
    <text x="886" y="204" font-size="15.5" fill="#94a3b8">since 09:14</text>
    <rect x="956" y="160" width="92" height="44" rx="10" fill="#7f1d1d" stroke="#f87171"/>
    <text x="1002" y="189" font-size="19" font-weight="600" fill="#fecaca" text-anchor="middle">Block</text>

    <g stroke="#475569" stroke-width="2">
      <line x1="102" y1="248" x2="102" y2="272"/>
      <line x1="520" y1="248" x2="520" y2="272"/>
      <line x1="777" y1="248" x2="777" y2="272"/>
      <line x1="936" y1="248" x2="936" y2="272"/>
      <line x1="1002" y1="248" x2="1002" y2="272"/>
    </g>
    <g font-size="18" fill="#94a3b8">
      <text x="76" y="298">who is talking</text>
      <text x="452" y="298">to whom</text>
      <text x="724" y="298">how much</text>
      <text x="898" y="298">how long</text>
      <text x="1064" y="298" text-anchor="end">undo included</text>
    </g>

    <!-- right-click menu -->
    <rect x="56" y="336" width="492" height="288" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="384" font-size="23" font-weight="700" fill="#f1f5f9">Right-click a row</text>
    <g font-size="18.5" fill="#cbd5e1">
      <text x="88" y="428">Block the process · block the IP</text>
      <text x="88" y="464">Trace: how was this spawned?</text>
      <text x="88" y="500">Peer into this connection</text>
      <text x="88" y="536">Reveal the real name (Sysmon)</text>
      <text x="88" y="572">Task details · kill · ignore</text>
    </g>
    <text x="88" y="608" font-size="16" fill="#64748b">The row surprises you? That's the moment to click.</text>

    <!-- TX-only lens -->
    <rect x="572" y="336" width="492" height="288" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="604" y="384" font-size="23" font-weight="700" fill="#f1f5f9">Lens: TX-only (no reply)</text>
    <g font-size="18.5" fill="#cbd5e1">
      <text x="604" y="428">One checkbox narrows the list to</text>
      <text x="604" y="464">senders that never heard a word</text>
      <text x="604" y="500">back — the shape of a beacon.</text>
    </g>
    <text x="604" y="572" font-size="16" fill="#94a3b8">A lens, not a verdict: uncheck it and</text>
    <text x="604" y="596" font-size="16" fill="#94a3b8">the full list is exactly where it was.</text>

    <text x="1064" y="640" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
