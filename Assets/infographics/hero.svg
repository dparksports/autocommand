<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-label="AutoCommand — see what your Windows PC is really doing, and stop what you don't want">
  <rect width="1120" height="300" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="106" font-size="54" font-weight="700" fill="#f1f5f9">AutoCommand</text>
    <text x="56" y="146" font-size="22" fill="#94a3b8">See what your Windows PC is really doing — and stop what you don't want.</text>

    <g font-size="14" fill="#cbd5e1">
      <rect x="56" y="188" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="76" y="209">Free &amp; open source</text>
      <rect x="228" y="188" width="112" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="248" y="209">Local-first</text>
      <rect x="352" y="188" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="372" y="209">Reversible by design</text>
      <rect x="514" y="188" width="116" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="534" y="209">No installer</text>
    </g>

    <rect x="664" y="52" width="400" height="212" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="688" cy="74" r="5" fill="#f87171"/>
    <circle cx="706" cy="74" r="5" fill="#fbbf24"/>
    <circle cx="724" cy="74" r="5" fill="#34d399"/>
    <text x="1040" y="79" font-size="13" fill="#64748b" text-anchor="end">live, right now</text>
    <line x1="680" y1="90" x2="1048" y2="90" stroke="#334155"/>

    <circle cx="700" cy="120" r="7" fill="#34d399"/>
    <text x="718" y="125" font-size="15" font-weight="600" fill="#f1f5f9">chrome.exe</text>
    <text x="718" y="143" font-size="13" fill="#94a3b8">update.google.com:443 · Google LLC · replied</text>
    <rect x="976" y="106" width="56" height="24" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="1004" y="122" font-size="12" fill="#94a3b8" text-anchor="middle">normal</text>

    <circle cx="700" cy="164" r="7" fill="#fbbf24"/>
    <text x="718" y="169" font-size="15" font-weight="600" fill="#f1f5f9">DiagTrack.exe</text>
    <text x="718" y="187" font-size="13" fill="#94a3b8">Phone Home card: 3.1 connects/hr · inside band</text>
    <rect x="976" y="150" width="56" height="24" rx="6" fill="#0b1220" stroke="#334155"/>
    <text x="1004" y="166" font-size="12" fill="#94a3b8" text-anchor="middle">known</text>

    <circle cx="700" cy="208" r="7" fill="#f87171"/>
    <text x="718" y="213" font-size="15" font-weight="600" fill="#f1f5f9">update.exe</text>
    <text x="718" y="231" font-size="13" fill="#94a3b8">sent packets · no reply yet · one click stops it</text>
    <rect x="956" y="194" width="76" height="24" rx="6" fill="#7f1d1d" stroke="#f87171"/>
    <text x="994" y="210" font-size="12" fill="#fecaca" text-anchor="middle">undoable</text>
  </g>
  <text x="1064" y="284" font-size="13" fill="#64748b" text-anchor="end" font-family="Segoe UI, Arial, sans-serif">AutoCommand · dparksports/autocommand</text>
</svg>
