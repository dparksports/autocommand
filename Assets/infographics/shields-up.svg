<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-label="The doors Windows leaves open: SSTP, Wi-Fi Direct, kernel debug, VPN services; LLMNR, NetBIOS, mDNS; hardening, hosts file, vendor opt-outs, startup and tasks, firewall profiles, leftover accounts">
<rect width="1120" height="300" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">SHIELDS UP — THE DOORS WINDOWS LEAVES OPEN</text><rect x="64" y="78" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="176" y="88" width="28" height="16" rx="8" fill="#34C759"/><circle cx="204" cy="96" r="5.5" fill="#FFFFFF"/><text x="78" y="122" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">SSTP VPN service</text><text x="78" y="140" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">and its miniports</text><rect x="230" y="78" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="342" y="88" width="28" height="16" rx="8" fill="#34C759"/><circle cx="370" cy="96" r="5.5" fill="#FFFFFF"/><text x="244" y="122" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Wi-Fi Direct</text><text x="244" y="140" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">the ghost hotspot</text><rect x="396" y="78" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="508" y="88" width="28" height="16" rx="8" fill="#34C759"/><circle cx="536" cy="96" r="5.5" fill="#FFFFFF"/><text x="410" y="122" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Kernel debug</text><text x="410" y="140" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">KDNET adapter off</text><rect x="562" y="78" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="674" y="88" width="28" height="16" rx="8" fill="#34C759"/><circle cx="702" cy="96" r="5.5" fill="#FFFFFF"/><text x="576" y="122" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">VPN services</text><text x="576" y="140" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">RasMan · IKEEXT · …</text><rect x="64" y="166" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="176" y="176" width="28" height="16" rx="8" fill="#34C759"/><circle cx="204" cy="184" r="5.5" fill="#FFFFFF"/><text x="78" y="210" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">LLMNR · NetBIOS</text><text x="78" y="228" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">the poisoning class</text><rect x="230" y="166" width="152" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="342" y="176" width="28" height="16" rx="8" fill="#34C759"/><circle cx="370" cy="184" r="5.5" fill="#FFFFFF"/><text x="244" y="210" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">mDNS</text><text x="244" y="228" font-size="11" font-weight="400" fill="#6E6E73" text-anchor="start">scoped block, honest</text><rect x="728" y="78" width="328" height="162" rx="18" fill="#EAF3FF" stroke="none" stroke-width="1"/><text x="748" y="108" font-size="13.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Also on the board</text><text x="748" y="134" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  IPv6 · LSA PPL · UAC strictness</text><text x="748" y="156" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  hosts-file audit</text><text x="748" y="178" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  vendor telemetry opt-outs</text><text x="748" y="200" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  startup &amp; tasks</text><text x="748" y="222" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  firewall profiles</text><text x="748" y="244" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">✓  leftover-account audit (new)</text><text x="64" y="274" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">A standalone native WinUI 3 app — born here as a tab; its engine (ShieldsUp.Core) is this repository’s and still powers AutoCommand. Closing a door is one click; re-opening it is a decision only you make.</text>
</g>
</svg>
