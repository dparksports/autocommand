<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="Shields Up: the doors Windows leaves open, name resolution, hardening, hosts file, vendor opt-outs, startup and tasks, firewall profiles">
  <rect width="1120" height="700" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="64" font-size="32" font-weight="700" fill="#f1f5f9">Shields Up — the doors Windows leaves open</text>
    <rect x="56" y="78" width="64" height="4" fill="#22d3ee"/>
    <text x="56" y="112" font-size="15.5" fill="#94a3b8">One board, live state, every action reversible. Closing is one click; re-opening is a decision you make in the tab.</text>

    <!-- doors row -->
    <text x="56" y="152" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">DOORS</text>
    <g>
      <rect x="56" y="166" width="238" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="196" font-size="15" font-weight="600" fill="#f1f5f9">SSTP VPN service</text>
      <text x="80" y="218" font-size="12.5" fill="#94a3b8">service + miniports, stopped</text>
      <text x="80" y="236" font-size="12.5" fill="#94a3b8">and disabled</text>

      <rect x="306" y="166" width="238" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="330" y="196" font-size="15" font-weight="600" fill="#f1f5f9">Wi-Fi Direct hotspot</text>
      <text x="330" y="218" font-size="12.5" fill="#94a3b8">the ghost hosted network</text>
      <text x="330" y="236" font-size="12.5" fill="#94a3b8">your laptop broadcasts</text>

      <rect x="556" y="166" width="238" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="580" y="196" font-size="15" font-weight="600" fill="#f1f5f9">Kernel debug (KDNET)</text>
      <text x="580" y="218" font-size="12.5" fill="#94a3b8">the debugger backdoor,</text>
      <text x="580" y="236" font-size="12.5" fill="#94a3b8">off unless you debug</text>

      <rect x="806" y="166" width="258" height="86" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="830" y="196" font-size="15" font-weight="600" fill="#f1f5f9">VPN services + miniports</text>
      <text x="830" y="218" font-size="12.5" fill="#94a3b8">RasMan · IKEEXT · PolicyAgent</text>
      <text x="830" y="236" font-size="12.5" fill="#94a3b8">WAN miniport adapters</text>
    </g>

    <!-- name resolution row -->
    <text x="56" y="290" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">LEGACY NAME RESOLUTION — THE CREDENTIAL-THEFT CLASS</text>
    <g>
      <rect x="56" y="304" width="322" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="334" font-size="15" font-weight="600" fill="#f1f5f9">LLMNR · UDP 5355</text>
      <text x="80" y="358" font-size="12.5" fill="#94a3b8">poisonable "who is called PRINTER?"</text>

      <rect x="392" y="304" width="322" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="416" y="334" font-size="15" font-weight="600" fill="#f1f5f9">NetBIOS · UDP 137</text>
      <text x="416" y="358" font-size="12.5" fill="#94a3b8">broadcasts every 1–2 minutes</text>

      <rect x="728" y="304" width="336" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="752" y="334" font-size="15" font-weight="600" fill="#f1f5f9">mDNS · UDP 5353</text>
      <text x="752" y="358" font-size="12.5" fill="#94a3b8">local device discovery, scoped</text>
    </g>

    <!-- hardening / hosts / telemetry -->
    <g>
      <rect x="56" y="410" width="322" height="118" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="440" font-size="15" font-weight="600" fill="#f1f5f9">OS hardening</text>
      <text x="80" y="464" font-size="12.5" fill="#94a3b8">IPv6 · LSA Protection · UAC strictness</text>
      <text x="80" y="486" font-size="12.5" fill="#94a3b8">Defender tamper state, read live</text>

      <rect x="392" y="410" width="322" height="118" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="416" y="440" font-size="15" font-weight="600" fill="#f1f5f9">Hosts file audit</text>
      <text x="416" y="464" font-size="12.5" fill="#94a3b8">what's pinned, by whom — and</text>
      <text x="416" y="486" font-size="12.5" fill="#94a3b8">telemetry pins the app can remove</text>

      <rect x="728" y="410" width="336" height="118" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="752" y="440" font-size="15" font-weight="600" fill="#f1f5f9">Vendor telemetry opt-outs</text>
      <text x="752" y="464" font-size="12.5" fill="#94a3b8">Edge · Chrome · VS Code · PowerShell 7</text>
      <text x="752" y="486" font-size="12.5" fill="#94a3b8">.NET CLI · Windows diagnostics…</text>
    </g>

    <!-- startup + profiles -->
    <g>
      <rect x="56" y="552" width="492" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="88" y="584" font-size="15.5" font-weight="700" fill="#f1f5f9">Startup &amp; Tasks</text>
      <g font-size="12.5" fill="#94a3b8">
        <text x="88" y="608">Logon items and scheduled tasks — the persistence</text>
        <text x="88" y="628">surface — on one board, one click from Shields Up.</text>
      </g>

      <rect x="572" y="552" width="492" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="604" y="584" font-size="15.5" font-weight="700" fill="#f1f5f9">Firewall profiles</text>
      <g font-size="12.5" fill="#94a3b8">
        <text x="604" y="608">strict public · home trusted · gaming &amp; media · office ·</text>
        <text x="604" y="628">shield up — Auto-Mitigate guards each preset's intent.</text>
      </g>
    </g>

    <text x="1064" y="684" font-size="13" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
