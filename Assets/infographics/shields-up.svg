<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-label="Shields Up: the doors Windows leaves open, name resolution, hardening, hosts file, vendor opt-outs, startup and tasks, firewall profiles">
  <rect width="1120" height="780" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">Shields Up</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>
    <text x="56" y="134" font-size="18.5" fill="#94a3b8">The doors Windows leaves open — one board, live state, all reversible.</text>

    <text x="56" y="176" font-size="16" font-weight="700" fill="#64748b" letter-spacing="3">DOORS</text>
    <g>
      <rect x="56" y="192" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="84" y="232" font-size="20" font-weight="600" fill="#f1f5f9">SSTP VPN service</text>
      <text x="84" y="262" font-size="15.5" fill="#94a3b8">stopped + disabled</text>

      <rect x="312" y="192" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="340" y="232" font-size="20" font-weight="600" fill="#f1f5f9">Wi-Fi Direct</text>
      <text x="340" y="262" font-size="15.5" fill="#94a3b8">ghost hotspot, off</text>

      <rect x="568" y="192" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="596" y="232" font-size="20" font-weight="600" fill="#f1f5f9">Kernel debug</text>
      <text x="596" y="262" font-size="15.5" fill="#94a3b8">the debugger door, closed</text>

      <rect x="824" y="192" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="852" y="232" font-size="20" font-weight="600" fill="#f1f5f9">VPN services</text>
      <text x="852" y="262" font-size="15.5" fill="#94a3b8">RasMan, IKEEXT &amp; WAN ports</text>
    </g>

    <text x="56" y="336" font-size="16" font-weight="700" fill="#64748b" letter-spacing="3">NAME RESOLUTION — THE CREDENTIAL-THEFT CLASS</text>
    <g>
      <rect x="56" y="352" width="325" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="84" y="392" font-size="20" font-weight="600" fill="#f1f5f9">LLMNR · UDP 5355</text>
      <text x="84" y="422" font-size="15.5" fill="#94a3b8">poisonable "who is PRINTER?"</text>

      <rect x="397" y="352" width="325" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="425" y="392" font-size="20" font-weight="600" fill="#f1f5f9">NetBIOS · UDP 137</text>
      <text x="425" y="422" font-size="15.5" fill="#94a3b8">broadcasts every minute</text>

      <rect x="738" y="352" width="326" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="766" y="392" font-size="20" font-weight="600" fill="#f1f5f9">mDNS · UDP 5353</text>
      <text x="766" y="422" font-size="15.5" fill="#94a3b8">local discovery, scoped</text>
    </g>

    <g>
      <rect x="56" y="480" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="84" y="520" font-size="20" font-weight="600" fill="#f1f5f9">OS hardening</text>
      <text x="84" y="550" font-size="15.5" fill="#94a3b8">IPv6 · LSA · UAC</text>

      <rect x="312" y="480" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="340" y="520" font-size="20" font-weight="600" fill="#f1f5f9">Hosts file</text>
      <text x="340" y="550" font-size="15.5" fill="#94a3b8">what's pinned, by whom</text>

      <rect x="568" y="480" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="596" y="520" font-size="20" font-weight="600" fill="#f1f5f9">Vendor opt-outs</text>
      <text x="596" y="550" font-size="15.5" fill="#94a3b8">Edge · Chrome · VS Code…</text>

      <rect x="824" y="480" width="240" height="104" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="852" y="520" font-size="20" font-weight="600" fill="#f1f5f9">Startup &amp; Tasks</text>
      <text x="852" y="550" font-size="15.5" fill="#94a3b8">persistence, one board</text>
    </g>

    <rect x="56" y="608" width="1008" height="116" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="650" font-size="23" font-weight="700" fill="#f1f5f9">Firewall profiles</text>
    <g font-size="16.5" fill="#cbd5e1">
      <rect x="88" y="668" width="150" height="36" rx="18" fill="#0b1220" stroke="#334155"/>
      <text x="163" y="692" text-anchor="middle">strict public</text>
      <rect x="250" y="668" width="150" height="36" rx="18" fill="#0b1220" stroke="#334155"/>
      <text x="325" y="692" text-anchor="middle">home trusted</text>
      <rect x="412" y="668" width="172" height="36" rx="18" fill="#0b1220" stroke="#334155"/>
      <text x="498" y="692" text-anchor="middle">gaming &amp; media</text>
      <rect x="596" y="668" width="104" height="36" rx="18" fill="#0b1220" stroke="#334155"/>
      <text x="648" y="692" text-anchor="middle">office</text>
      <rect x="712" y="668" width="136" height="36" rx="18" fill="#0b1220" stroke="#334155"/>
      <text x="780" y="692" text-anchor="middle">shield up</text>
    </g>
    <text x="1048" y="692" font-size="15" fill="#94a3b8" text-anchor="end">Auto-Mitigate guards</text>
    <text x="1048" y="712" font-size="15" fill="#94a3b8" text-anchor="end">each preset's intent</text>

    <text x="1064" y="764" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
