<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="468" viewBox="0 0 1120 468" role="img" aria-label="The sidebar, grouped by the question you’re asking: Watch, Contain, System">
<rect width="1120" height="468" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">WHERE EVERYTHING LIVES</text><text x="64" y="88" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">Grouped by the question you’re asking — not by what the tools do internally.</text><rect x="64" y="112" width="328" height="328" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="86" y="146" font-size="13" font-weight="700" fill="#0071E3" text-anchor="start" letter-spacing="1.2">WATCH</text><text x="86" y="168" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">a question about traffic</text><line x1="86" y1="182" x2="370" y2="182" stroke="#D2D2D7" stroke-width="1"/><text x="86" y="206" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Process Monitor</text><text x="86" y="226" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">every connection, who launched it</text><line x1="86" y1="246" x2="370" y2="246" stroke="#D2D2D7" stroke-width="1"/><text x="86" y="284" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Exfil</text><text x="86" y="304" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">typing vs telemetry, hourly, opt-in</text><line x1="86" y1="324" x2="370" y2="324" stroke="#D2D2D7" stroke-width="1"/><text x="86" y="362" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Matrix rain</text><text x="86" y="382" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">the same feed, replayed live</text><rect x="412" y="112" width="328" height="328" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="434" y="146" font-size="13" font-weight="700" fill="#0071E3" text-anchor="start" letter-spacing="1.2">CONTAIN</text><text x="434" y="168" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">a decision about traffic</text><line x1="434" y1="182" x2="718" y2="182" stroke="#D2D2D7" stroke-width="1"/><text x="434" y="206" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Firewall</text><text x="434" y="226" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">block, gate, whitelist, profile</text><line x1="434" y1="246" x2="718" y2="246" stroke="#D2D2D7" stroke-width="1"/><text x="434" y="284" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Blocks</text><text x="434" y="304" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">everything stopped, one list</text><line x1="434" y1="324" x2="718" y2="324" stroke="#D2D2D7" stroke-width="1"/><text x="434" y="362" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Audit</text><text x="434" y="382" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">everything the app did, one ledger</text><rect x="760" y="112" width="328" height="328" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="782" y="146" font-size="13" font-weight="700" fill="#0071E3" text-anchor="start" letter-spacing="1.2">SYSTEM</text><text x="782" y="168" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">everything else</text><line x1="782" y1="182" x2="1066" y2="182" stroke="#D2D2D7" stroke-width="1"/><text x="782" y="206" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Be My Guest</text><text x="782" y="226" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">invite your AI assistant, locally</text><line x1="782" y1="246" x2="1066" y2="246" stroke="#D2D2D7" stroke-width="1"/><text x="782" y="284" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Settings</text><text x="782" y="304" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">preferences and instrumentation</text><line x1="782" y1="324" x2="1066" y2="324" stroke="#D2D2D7" stroke-width="1"/><text x="782" y="362" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Investigate</text><text x="782" y="382" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">one process, one verdict (Advanced)</text>
</g>
</svg>
