<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-label="Nothing by default: three narrow lookups spelled out, everything else local">
<rect width="1120" height="330" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">WHAT IT SENDS ABOUT YOU</text><rect x="64" y="78" width="992" height="64" rx="16" fill="#EAF3FF" stroke="none" stroke-width="1"/><text x="86" y="116" font-size="16.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Nothing, by default. Everything happens on your computer.</text><rect x="64" y="162" width="328" height="92" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="84" y="192" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">RDAP lookups</text><text x="84" y="214" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">automatic, HTTPS — asks the registry who</text><text x="84" y="231" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">owns an IP; sends the queried IP and nothing</text><text x="84" y="248" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">else</text><rect x="412" y="162" width="328" height="92" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="432" y="192" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Sysmon download</text><text x="432" y="214" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">only when you click Install —</text><text x="432" y="231" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">Authenticode-verified before it runs</text><rect x="760" y="162" width="328" height="92" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="780" y="192" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">DBX blob</text><text x="780" y="214" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">secure-boot revocation list — only from</text><text x="780" y="231" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">Shields Up, only that file</text><text x="64" y="286" font-size="13.5" font-weight="400" fill="#6E6E73" text-anchor="start">The one optional extra — an anonymous daily count with no identifiers, not even a random one — is off unless you say yes.</text>
</g>
</svg>
