<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-label="Try AutoCommand in three steps: download and unzip, run as administrator, look around">
  <rect width="1120" height="440" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">Try it in five minutes</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>

    <!-- step 1 -->
    <rect x="56" y="140" width="308" height="240" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="108" cy="192" r="24" fill="#22d3ee"/>
    <text x="108" y="201" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">1</text>
    <text x="148" y="200" font-size="23" font-weight="600" fill="#f1f5f9">Download</text>
    <text x="88" y="254" font-size="18.5" fill="#cbd5e1">The zip from Releases,</text>
    <text x="88" y="282" font-size="18.5" fill="#cbd5e1">unzipped anywhere.</text>
    <text x="88" y="334" font-size="16" fill="#94a3b8">No installer. Every release</text>
    <text x="88" y="358" font-size="16" fill="#94a3b8">ships SHA-256 checksums.</text>

    <path d="M 384 260 L 384 248 L 404 260 L 384 272 Z" fill="#64748b"/>

    <!-- step 2 -->
    <rect x="424" y="140" width="308" height="240" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="476" cy="192" r="24" fill="#22d3ee"/>
    <text x="476" y="201" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">2</text>
    <text x="516" y="200" font-size="23" font-weight="600" fill="#f1f5f9">Run as admin</text>
    <text x="456" y="254" font-size="18.5" fill="#cbd5e1">Right-click the exe —</text>
    <text x="456" y="282" font-size="18.5" fill="#cbd5e1">like Task Manager asks.</text>
    <text x="456" y="334" font-size="16" fill="#94a3b8">Blue SmartScreen?</text>
    <text x="456" y="358" font-size="16" fill="#94a3b8">More info → Run anyway.</text>

    <path d="M 752 260 L 752 248 L 772 260 L 752 272 Z" fill="#64748b"/>

    <!-- step 3 -->
    <rect x="792" y="140" width="308" height="240" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="844" cy="192" r="24" fill="#22d3ee"/>
    <text x="844" y="201" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
    <text x="884" y="200" font-size="23" font-weight="600" fill="#f1f5f9">Look around</text>
    <text x="824" y="254" font-size="18.5" fill="#cbd5e1">Every program talking</text>
    <text x="824" y="282" font-size="18.5" fill="#cbd5e1">to the internet, live.</text>
    <text x="824" y="334" font-size="16" fill="#94a3b8">Looking changes nothing —</text>
    <text x="824" y="358" font-size="16" fill="#94a3b8">that's the whole tutorial.</text>

    <text x="1064" y="420" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
