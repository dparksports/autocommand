<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="286" viewBox="0 0 1120 286" role="img" aria-label="Three steps: download and unzip, run as administrator, look around">
<rect width="1120" height="286" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">TRY IT IN FIVE MINUTES</text><rect x="64" y="78" width="317" height="118" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="84" y="118" font-size="26" font-weight="700" fill="#0071E3" text-anchor="start">1</text><text x="116" y="115" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Download &amp; unzip</text><text x="84" y="142" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">AutoCommand-v…-win-x64.zip from Releases —</text><text x="84" y="159" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">checksums included, no installer.</text><rect x="405" y="78" width="317" height="118" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="425" y="118" font-size="26" font-weight="700" fill="#0071E3" text-anchor="start">2</text><text x="457" y="115" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Run as administrator</text><text x="425" y="142" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Same reason Task Manager asks: to see the</text><text x="425" y="159" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">whole machine, not just your user.</text><rect x="746" y="78" width="317" height="118" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="766" y="118" font-size="26" font-weight="700" fill="#0071E3" text-anchor="start">3</text><text x="798" y="115" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Look around, ask something</text><text x="766" y="142" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">The first screen lists every program</text><text x="766" y="159" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">talking to the internet right now.</text><text x="64" y="226" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">Air-gapped PC? Everything works offline — bring your own Sysmon64.exe (download it on any connected machine, move it over by USB).</text>
</g>
</svg>
