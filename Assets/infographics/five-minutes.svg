<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="Try AutoCommand in five minutes: download, run as administrator, look around">
  <rect width="1120" height="430" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="64" font-size="32" font-weight="700" fill="#f1f5f9">Try it in five minutes</text>
    <rect x="56" y="78" width="64" height="4" fill="#22d3ee"/>

    <!-- step 1 -->
    <rect x="56" y="120" width="308" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="100" cy="164" r="18" fill="#22d3ee"/>
    <text x="100" y="171" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">1</text>
    <text x="132" y="171" font-size="19" font-weight="600" fill="#f1f5f9">Download &amp; unzip</text>
    <g font-size="14" fill="#cbd5e1">
      <text x="88" y="212">Grab the zip from Releases and</text>
      <text x="88" y="236">unzip it anywhere.</text>
      <text x="88" y="278">No installer — and every release</text>
      <text x="88" y="302">ships SHA-256 checksums, so you</text>
      <text x="88" y="326">can verify what you downloaded.</text>
    </g>

    <path d="M 380 240 L 380 232 L 396 240 L 380 248 Z" fill="#475569"/>

    <!-- step 2 -->
    <rect x="424" y="120" width="308" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="468" cy="164" r="18" fill="#22d3ee"/>
    <text x="468" y="171" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">2</text>
    <text x="500" y="171" font-size="19" font-weight="600" fill="#f1f5f9">Run as administrator</text>
    <g font-size="14" fill="#cbd5e1">
      <text x="456" y="212">Right-click AutoCommand.exe.</text>
      <text x="456" y="236">Same reason Task Manager asks:</text>
      <text x="456" y="260">to see the whole machine.</text>
      <text x="456" y="298">Blue "protected your PC" screen?</text>
      <text x="456" y="322">More info → Run anyway. It is open</text>
      <text x="456" y="346">source — anyone can read it.</text>
    </g>

    <path d="M 748 240 L 748 232 L 764 240 L 748 248 Z" fill="#475569"/>

    <!-- step 3 -->
    <rect x="792" y="120" width="308" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="836" cy="164" r="18" fill="#22d3ee"/>
    <text x="836" y="171" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
    <text x="868" y="171" font-size="19" font-weight="600" fill="#f1f5f9">Look around</text>
    <g font-size="14" fill="#cbd5e1">
      <text x="824" y="212">The first screen lists every</text>
      <text x="824" y="236">program talking to the internet</text>
      <text x="824" y="260">right now, in plain English.</text>
      <text x="824" y="298">Looking changes nothing —</text>
      <text x="824" y="322">that's the whole tutorial.</text>
    </g>

    <text x="1064" y="408" font-size="13" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
