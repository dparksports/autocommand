<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-label="You press Start, a local bridge session runs on your machine, your MCP assistant connects through the unprivileged AgentProxy">
<rect width="1120" height="240" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">BE MY GUEST — YOUR AI ASSISTANT, INVITED</text><rect x="64" y="80" width="214" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="84" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">You</text><text x="84" y="132" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">press Start</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 284 117 h 18 M 296 110.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="310" y="80" width="214" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="330" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Local bridge</text><text x="330" y="132" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">loopback · bearer token</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 530 117 h 18 M 542 110.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="556" y="80" width="214" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="576" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">AgentProxy</text><text x="576" y="132" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">small, unprivileged</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 776 117 h 18 M 788 110.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="802" y="80" width="214" height="74" rx="18" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="822" y="110" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Your assistant</text><text x="822" y="132" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="start">MCP client</text><text x="64" y="188" font-size="13.5" font-weight="400" fill="#6E6E73" text-anchor="start">The door is only open while you keep it open: sessions start only from the Start button, and every tool call lands in the live activity log.</text><text x="64" y="212" font-size="13.5" font-weight="400" fill="#6E6E73" text-anchor="start">No cloud middleman, no account. One honest boundary: while a session runs, its token lives in a local file — anything running as your user can read what the AI reads.</text>
</g>
</svg>
