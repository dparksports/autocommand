<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>An AI assistant must ask permission for every change, and temporary unblocks run out on their own</title>
  <rect width="1200" height="560" fill="#F6F8FB"/>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#10202E">Let your AI assistant look. Not touch.</text>

  <!-- left: assistant asks -->
  <rect x="60" y="110" width="340" height="350" rx="14" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="84" y="142" font-size="13" fill="#7B8A9A" letter-spacing="1">YOUR ASSISTANT SAYS</text>
  <rect x="84" y="165" width="290" height="110" rx="14" fill="#EEF3F8"/>
  <text x="102" y="197" font-size="15" fill="#10202E">“May I pause the block on</text>
  <text x="102" y="221" font-size="15" fill="#10202E">cdn.example.com for 10</text>
  <text x="102" y="245" font-size="15" fill="#10202E">minutes?”</text>

  <line x1="404" y1="285" x2="422" y2="285" stroke="#007AFF" stroke-width="3"/>
  <polygon points="422,277 436,285 422,293" fill="#007AFF"/>

  <!-- center: the permission dialog -->
  <rect x="440" y="110" width="360" height="350" rx="16" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="2"/>
  <rect x="440" y="110" width="360" height="48" rx="16" fill="#1B2733"/>
  <rect x="440" y="142" width="360" height="16" fill="#1B2733"/>
  <text x="462" y="140" font-size="15" font-weight="600" fill="#FFFFFF">AutoCommand asks you</text>
  <text x="462" y="192" font-size="16" fill="#10202E">Your AI assistant wants to</text>
  <text x="462" y="216" font-size="16" fill="#10202E">pause the block on</text>
  <text x="462" y="240" font-size="16" fill="#10202E">cdn.example.com — 10 minutes.</text>
  <rect x="462" y="296" width="150" height="42" rx="21" fill="#007AFF"/>
  <text x="537" y="323" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Allow once</text>
  <rect x="626" y="296" width="120" height="42" rx="21" fill="#F1F4F8" stroke="#DCE4EC"/>
  <text x="686" y="323" font-size="15" fill="#33445A" text-anchor="middle">Deny</text>
  <text x="462" y="382" font-size="14" fill="#7A4A12" font-weight="600">No answer in 90 seconds = No.</text>

  <line x1="804" y1="285" x2="822" y2="285" stroke="#007AFF" stroke-width="3"/>
  <polygon points="822,277 836,285 822,293" fill="#007AFF"/>

  <!-- right: auto re-lock -->
  <rect x="840" y="110" width="320" height="350" rx="14" fill="#F0FAF3" stroke="#BFDFC9" stroke-width="1.5"/>
  <text x="864" y="142" font-size="13" fill="#1E7F3C" letter-spacing="1">WHEN YOU SAY YES</text>
  <circle cx="892" cy="225" r="34" fill="#FFFFFF" stroke="#1E7F3C" stroke-width="3"/>
  <line x1="892" y1="225" x2="892" y2="203" stroke="#1E7F3C" stroke-width="3" stroke-linecap="round"/>
  <line x1="892" y1="225" x2="908" y2="231" stroke="#1E7F3C" stroke-width="3" stroke-linecap="round"/>
  <text x="944" y="232" font-size="18" font-weight="700" fill="#1E7F3C">10 min</text>
  <text x="864" y="296" font-size="16" fill="#10202E">then blocking switches</text>
  <text x="864" y="320" font-size="16" fill="#10202E">back on — by itself,</text>
  <text x="864" y="344" font-size="16" fill="#10202E">even if the app is closed.</text>
  <text x="864" y="384" font-size="14" fill="#5B6B7C">Nothing stays open by accident.</text>

  <text x="60" y="505" font-size="17" fill="#5B6B7C">Reading is free. Changing anything always asks you first — and silence means no.</text>
</svg>
