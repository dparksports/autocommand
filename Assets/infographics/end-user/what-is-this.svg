<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>Right-click any program and get its backstory</title>
  <rect width="1200" height="560" fill="#F6F8FB"/>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#10202E">“What is this thing?” One right-click tells you.</text>

  <!-- left: the mystery -->
  <rect x="60" y="110" width="460" height="340" rx="14" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="84" y="142" font-size="13" fill="#7B8A9A" letter-spacing="1">YOU SEE THIS IN THE LIST</text>
  <text x="84" y="182" font-size="22" font-weight="700" fill="#10202E">taskhostw.exe</text>
  <text x="84" y="214" font-size="18" fill="#33445A">→ 52.113.194.20</text>
  <circle cx="200" cy="300" r="40" fill="#EEF3F8"/>
  <text x="200" y="316" font-size="44" font-weight="700" fill="#7B8A9A" text-anchor="middle">?</text>
  <text x="84" y="388" font-size="15" fill="#5B6B7C">Looks like noise.</text>
  <text x="84" y="412" font-size="15" fill="#5B6B7C">Nobody outside IT knows what taskhostw is.</text>

  <!-- arrow -->
  <line x1="540" y1="280" x2="618" y2="280" stroke="#007AFF" stroke-width="3"/>
  <polygon points="618,270 640,280 618,290" fill="#007AFF"/>

  <!-- right: the story -->
  <rect x="660" y="110" width="480" height="340" rx="14" fill="#F2FAF5" stroke="#9FD8B4" stroke-width="1.5"/>
  <text x="684" y="142" font-size="13" fill="#1E7F3C" letter-spacing="1">AUTOCOMMAND ANSWERS</text>
  <text x="684" y="182" font-size="17" fill="#10202E">Launched by a scheduled task at 9:14 AM —</text>
  <text x="684" y="208" font-size="17" fill="#10202E">the Microsoft Edge updater.</text>
  <text x="684" y="238" font-size="17" fill="#10202E">Signed by Microsoft: genuine.</text>
  <rect x="684" y="260" width="230" height="32" rx="16" fill="#1E7F3C"/>
  <text x="799" y="281" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Verdict: scheduled task ✓</text>
  <text x="684" y="366" font-size="15" fill="#5B6B7C">Evidence: spawn records, task history,</text>
  <text x="684" y="388" font-size="15" fill="#5B6B7C">registry autostarts — joined for you.</text>

  <text x="60" y="505" font-size="17" fill="#5B6B7C">Every program has a backstory. One right-click finds it — no terminal, no research rabbit hole.</text>
</svg>
