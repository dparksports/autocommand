<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>One click restores the internet after a block goes too far</title>
  <rect width="1200" height="560" fill="#F6F8FB"/>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#10202E">Blocked too well? One click brings the internet back.</text>

  <!-- left: the accident -->
  <rect x="60" y="110" width="330" height="350" rx="14" fill="#FDF0EF" stroke="#F2C1BB" stroke-width="1.5"/>
  <circle cx="225" cy="205" r="36" fill="#B3261E"/>
  <line x1="207" y1="187" x2="243" y2="223" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="243" y1="187" x2="207" y2="223" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <text x="84" y="286" font-size="17" fill="#7A1E15">Your internet stops</text>
  <text x="84" y="312" font-size="17" fill="#7A1E15">working right after</text>
  <text x="84" y="338" font-size="17" fill="#7A1E15">you blocked something.</text>
  <text x="84" y="372" font-size="14" fill="#A9554C">(It happens to everyone —</text>
  <text x="84" y="394" font-size="14" fill="#A9554C">that's why the button exists.)</text>

  <!-- center: the button -->
  <rect x="430" y="110" width="340" height="350" rx="14" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="460" y="225" width="280" height="72" rx="36" fill="#FF9500"/>
  <text x="600" y="268" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">🚑 Restore Internet</text>
  <text x="600" y="330" font-size="15" fill="#5B6B7C" text-anchor="middle">one click — done in seconds</text>
  <text x="600" y="362" font-size="14" fill="#7B8A9A" text-anchor="middle">it asks “are you sure?” first</text>

  <!-- right: what happened -->
  <rect x="810" y="110" width="330" height="350" rx="14" fill="#F0FAF3" stroke="#BFDFC9" stroke-width="1.5"/>
  <text x="834" y="142" font-size="13" fill="#1E7F3C" letter-spacing="1">WHAT JUST HAPPENED</text>
  <text x="834" y="186" font-size="16" fill="#10202E">✓ All blocks paused —</text>
  <text x="852" y="208" font-size="16" fill="#10202E">nothing deleted</text>
  <text x="834" y="240" font-size="16" fill="#10202E">✓ DNS cache flushed</text>
  <text x="834" y="272" font-size="16" fill="#10202E">✓ Action written to your</text>
  <text x="852" y="294" font-size="16" fill="#10202E">readable history</text>
  <text x="834" y="340" font-size="15" fill="#5B6B7C">Turn the blocks back on</text>
  <text x="834" y="362" font-size="15" fill="#5B6B7C">whenever you like.</text>

  <text x="60" y="505" font-size="17" fill="#5B6B7C">A block should never be a one-way door.</text>
</svg>
