<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>AutoCommand — see what your PC does online, and stop what shouldn't</title>
  <rect width="1200" height="640" fill="#F6F8FB"/>

  <!-- ══ app window (left) ══ -->
  <rect x="60" y="80" width="600" height="470" rx="14" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <rect x="60" y="80" width="600" height="46" rx="14" fill="#1B2733"/>
  <rect x="60" y="112" width="600" height="14" fill="#1B2733"/>
  <!-- magnifier icon -->
  <circle cx="92" cy="103" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="98" y1="109" x2="104" y2="115" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="114" y="109" font-size="17" fill="#FFFFFF" font-weight="600">Process Monitor</text>
  <circle cx="618" cy="103" r="5" fill="#34C759"/>
  <text x="630" y="108" font-size="12" fill="#9FB0C0">live</text>

  <!-- column captions -->
  <text x="92" y="158" font-size="13" fill="#7B8A9A" letter-spacing="1">PROGRAM</text>
  <text x="260" y="158" font-size="13" fill="#7B8A9A" letter-spacing="1">TALKING TO</text>
  <text x="430" y="158" font-size="13" fill="#7B8A9A" letter-spacing="1">WHO RUNS IT</text>
  <text x="552" y="158" font-size="13" fill="#7B8A9A" letter-spacing="1">STATUS</text>

  <!-- row 1: allowed browser -->
  <rect x="76" y="172" width="568" height="70" rx="10" fill="#FAFBFD" stroke="#E9EEF4"/>
  <text x="92" y="200" font-size="17" font-weight="600" fill="#1B2733">msedge.exe</text>
  <text x="92" y="224" font-size="13" fill="#7B8A9A">your browser</text>
  <text x="260" y="200" font-size="16" fill="#1B2733">linkedin.com</text>
  <text x="260" y="224" font-size="13" fill="#7B8A9A">sign-in page</text>
  <text x="430" y="200" font-size="16" fill="#1B2733">Microsoft</text>
  <text x="430" y="224" font-size="13" fill="#7B8A9A">United States</text>
  <rect x="552" y="188" width="80" height="28" rx="14" fill="#EAF7EE"/>
  <text x="592" y="207" font-size="13" fill="#1E7F3C" text-anchor="middle">Allowed</text>

  <!-- row 2: allowed windows service -->
  <rect x="76" y="252" width="568" height="70" rx="10" fill="#FAFBFD" stroke="#E9EEF4"/>
  <text x="92" y="280" font-size="17" font-weight="600" fill="#1B2733">svchost.exe</text>
  <text x="92" y="304" font-size="13" fill="#7B8A9A">Windows Update service</text>
  <text x="260" y="280" font-size="16" fill="#1B2733">20.42.65.92</text>
  <text x="260" y="304" font-size="13" fill="#7B8A9A">Windows Update</text>
  <text x="430" y="280" font-size="16" fill="#1B2733">Microsoft</text>
  <text x="430" y="304" font-size="13" fill="#7B8A9A">United States</text>
  <rect x="552" y="268" width="80" height="28" rx="14" fill="#EAF7EE"/>
  <text x="592" y="287" font-size="13" fill="#1E7F3C" text-anchor="middle">Allowed</text>

  <!-- row 3: blocked unknown -->
  <rect x="76" y="332" width="568" height="70" rx="10" fill="#FEF1F0" stroke="#F3C4BE"/>
  <text x="92" y="360" font-size="17" font-weight="600" fill="#B3261E">backup-helper.exe</text>
  <text x="92" y="384" font-size="13" fill="#7B8A9A">installed 3 days ago</text>
  <text x="260" y="360" font-size="16" fill="#1B2733">cdn.faststorage.io</text>
  <text x="260" y="384" font-size="13" fill="#7B8A9A">unknown company</text>
  <text x="430" y="360" font-size="16" fill="#1B2733">Unidentified</text>
  <text x="430" y="384" font-size="13" fill="#7B8A9A">Netherlands</text>
  <rect x="552" y="348" width="80" height="28" rx="14" fill="#B3261E"/>
  <text x="592" y="367" font-size="13" fill="#FFFFFF" text-anchor="middle">Blocked</text>

  <!-- attempts banner -->
  <rect x="76" y="414" width="568" height="38" rx="10" fill="#FDF0EF" stroke="#F3C4BE"/>
  <text x="92" y="438" font-size="14" fill="#B3261E" font-weight="600">137 attempts since you blocked it — every one stopped.</text>

  <!-- footnote -->
  <text x="84" y="482" font-size="14" fill="#5B6B7C">Right-click any row to trace it, block it, or ignore it.</text>

  <!-- status bar -->
  <rect x="60" y="500" width="600" height="50" rx="14" fill="#F1F5F9"/>
  <rect x="60" y="500" width="600" height="14" fill="#F1F5F9"/>
  <circle cx="92" cy="526" r="4" fill="#34C759"/>
  <text x="104" y="531" font-size="13" fill="#5B6B7C">watching live</text>
  <rect x="455" y="510" width="180" height="32" rx="16" fill="#FF9500"/>
  <text x="545" y="531" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">🚑 Restore Internet</text>

  <!-- ══ headline (right) ══ -->
  <text x="710" y="140" font-size="36" font-weight="700" fill="#10202E">See what your PC</text>
  <text x="710" y="186" font-size="36" font-weight="700" fill="#10202E">does online — and</text>
  <text x="710" y="232" font-size="36" font-weight="700" fill="#10202E">stop what shouldn't.</text>

  <circle cx="716" cy="284" r="5" fill="#007AFF"/>
  <text x="734" y="290" font-size="17" fill="#223349">Trace any program's backstory</text>
  <circle cx="716" cy="320" r="5" fill="#007AFF"/>
  <text x="734" y="326" font-size="17" fill="#223349">Block what you don't trust — safely</text>
  <circle cx="716" cy="356" r="5" fill="#007AFF"/>
  <text x="734" y="362" font-size="17" fill="#223349">Undo anything, always</text>

  <rect x="710" y="412" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#DCE4EC"/>
  <text x="728" y="434" font-size="14" fill="#33445A">Free · open source</text>
  <rect x="710" y="452" width="230" height="34" rx="17" fill="#FFFFFF" stroke="#DCE4EC"/>
  <text x="728" y="474" font-size="14" fill="#33445A">Nothing leaves your PC</text>
  <rect x="710" y="492" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#DCE4EC"/>
  <text x="728" y="514" font-size="14" fill="#33445A">One-click internet restore</text>
</svg>
