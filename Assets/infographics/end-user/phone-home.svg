<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img">
  <title>Block an app once — it stays blocked and you can see it trying</title>
  <rect width="1200" height="560" fill="#F6F8FB"/>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#10202E">A free app keeps phoning home? Make it stop.</text>

  <!-- left: before -->
  <rect x="60" y="110" width="500" height="350" rx="14" fill="#FFFFFF" stroke="#E3E8EF" stroke-width="1.5"/>
  <text x="84" y="142" font-size="13" fill="#7B8A9A" letter-spacing="1">BEFORE</text>
  <rect x="84" y="180" width="190" height="56" rx="12" fill="#EEF3F8"/>
  <text x="179" y="213" font-size="16" font-weight="600" fill="#10202E" text-anchor="middle">fun-tool.exe</text>
  <line x1="284" y1="196" x2="412" y2="196" stroke="#FF9500" stroke-width="2.5"/>
  <polygon points="412,190 426,196 412,202" fill="#FF9500"/>
  <line x1="284" y1="208" x2="412" y2="208" stroke="#FF9500" stroke-width="2.5"/>
  <polygon points="412,202 426,208 412,214" fill="#FF9500"/>
  <line x1="284" y1="220" x2="412" y2="220" stroke="#FF9500" stroke-width="2.5"/>
  <polygon points="412,214 426,220 412,226" fill="#FF9500"/>
  <rect x="430" y="162" width="112" height="92" rx="12" fill="#FFF4E5" stroke="#F2C98A"/>
  <text x="486" y="200" font-size="13" fill="#7A4A12" text-anchor="middle">its own</text>
  <text x="486" y="220" font-size="13" fill="#7A4A12" text-anchor="middle">server</text>
  <text x="84" y="290" font-size="16" fill="#10202E">Checks in every hour, sends who-knows-what.</text>
  <text x="84" y="316" font-size="14" fill="#7B8A9A">You can't even tell what it's sending.</text>

  <!-- right: after -->
  <rect x="640" y="110" width="500" height="350" rx="14" fill="#F0FAF3" stroke="#BFDFC9" stroke-width="1.5"/>
  <text x="664" y="142" font-size="13" fill="#1E7F3C" letter-spacing="1">AFTER ONE CLICK</text>
  <circle cx="754" cy="208" r="46" fill="none" stroke="#B3261E" stroke-width="3" stroke-dasharray="6 5"/>
  <rect x="664" y="180" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#F2C1BB"/>
  <text x="754" y="213" font-size="16" font-weight="600" fill="#10202E" text-anchor="middle">fun-tool.exe</text>
  <line x1="856" y1="208" x2="926" y2="208" stroke="#B3261E" stroke-width="2.5"/>
  <polygon points="926,202 938,208 926,214" fill="#B3261E"/>
  <line x1="932" y1="202" x2="944" y2="214" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>
  <line x1="944" y1="202" x2="932" y2="214" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>
  <rect x="956" y="162" width="112" height="92" rx="12" fill="#F6F8FB" stroke="#DCE4EC" stroke-dasharray="5 4"/>
  <text x="1012" y="200" font-size="13" fill="#7B8A9A" text-anchor="middle">never</text>
  <text x="1012" y="220" font-size="13" fill="#7B8A9A" text-anchor="middle">arrives</text>
  <text x="664" y="290" font-size="16" fill="#10202E">Attempts since you blocked it: 137.</text>
  <text x="664" y="316" font-size="16" font-weight="700" fill="#1E7F3C">Every one stopped ✓</text>
  <text x="664" y="348" font-size="14" fill="#5B6B7C">You don't have to catch it in the act —</text>
  <text x="664" y="370" font-size="14" fill="#5B6B7C">the attempts are counted for you.</text>

  <text x="60" y="505" font-size="17" fill="#5B6B7C">Blocks follow the program — even after it updates, moves folders, or reappears somewhere new.</text>
</svg>
