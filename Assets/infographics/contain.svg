<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-label="Stopping is safe: pre-block brief, reversible blocks, self-closing gates, containment proof, panic button, lockdown snapshots">
  <rect width="1120" height="680" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">Stopping is safe</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>
    <text x="56" y="134" font-size="18.5" fill="#94a3b8">Every stop is reversible. Nothing is ever deleted along the way.</text>

    <rect x="56" y="164" width="492" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="208" font-size="23" font-weight="700" fill="#f1f5f9">1 · The pre-block brief</text>
    <text x="88" y="248" font-size="18" fill="#cbd5e1">Says exactly what the rule will do —</text>
    <text x="88" y="276" font-size="18" fill="#cbd5e1">before you confirm anything.</text>

    <rect x="572" y="164" width="492" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="604" y="208" font-size="23" font-weight="700" fill="#f1f5f9">2 · Block, with undo</text>
    <text x="604" y="248" font-size="18" fill="#cbd5e1">Per IP or per program. Your reason,</text>
    <text x="604" y="276" font-size="18" fill="#cbd5e1">live hit counts, one-click undo.</text>

    <rect x="56" y="328" width="492" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="372" font-size="23" font-weight="700" fill="#f1f5f9">3 · Gates: temporary unblock</text>
    <text x="88" y="412" font-size="18" fill="#cbd5e1">Open for 1, 10, 30 or 60 minutes —</text>
    <text x="88" y="440" font-size="18" fill="#cbd5e1">then blocking returns by itself.</text>

    <rect x="572" y="328" width="492" height="140" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="604" y="372" font-size="23" font-weight="700" fill="#f1f5f9">4 · Proof it holds</text>
    <text x="604" y="412" font-size="18" fill="#cbd5e1">Attempts vs live sockets vs the TLS</text>
    <text x="604" y="440" font-size="18" fill="#cbd5e1">archive: contained · stale · leak.</text>

    <rect x="56" y="492" width="1008" height="84" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="88" y="532" font-size="25" font-weight="700" fill="#fecaca">Restore Internet — the panic button</text>
    <text x="88" y="560" font-size="17" fill="#fecaca" opacity="0.9">One click. Every block the app ever made, off. Nothing deleted.</text>

    <rect x="56" y="596" width="1008" height="56" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="630" font-size="17" fill="#94a3b8">Even the nuclear option photographs first: lockdown snapshots every rule, Restore snapshot brings them back.</text>

    <text x="1064" y="668" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
