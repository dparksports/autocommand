<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="252" viewBox="0 0 1120 252" role="img" aria-label="The 2 a.m. svchost worry, answered by one row">
<rect width="1120" height="252" fill="#FFFFFF"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="11" font-weight="600" fill="#0071E3" text-anchor="start" letter-spacing="1.4">WHEN SOMETHING LOOKS ODD</text><text x="64" y="90" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">The 2 a.m. worry, from this app’s own development machine:</text><rect x="64" y="112" width="460" height="64" rx="14" fill="#F5F5F7" stroke="none" stroke-width="1"/><text x="84" y="138" font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="start">“svchost.exe is uploading packets”</text><text x="84" y="160" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">sounds alarming at midnight — reinstall? forums?</text><g fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 538 144 h 18 M 550 137.5 l 6.5 6.5 l -6.5 6.5"/></g><rect x="580" y="112" width="476" height="64" rx="14" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="600" y="138" font-size="13.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Chrome’s updater, downloading from Google’s</text><text x="600" y="160" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">own servers — launched by a scheduled task. One row proved it.</text><text x="64" y="218" font-size="13.5" font-weight="400" fill="#6E6E73" text-anchor="start">No panic, no reinstall, no forum archaeology. When a row surprises you, that’s the moment to click — most rows, you’ll never need to think about.</text>
</g>
</svg>
