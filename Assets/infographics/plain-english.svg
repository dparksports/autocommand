<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-label="When something looks odd: the svchost worry answered by one row">
  <rect width="1120" height="470" fill="#0f172a"/>
  <rect width="1120" height="6" fill="#22d3ee"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="78" font-size="42" font-weight="700" fill="#f1f5f9">When something looks odd</text>
    <rect x="56" y="96" width="80" height="5" fill="#22d3ee"/>

    <rect x="56" y="136" width="308" height="252" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="88" y="184" font-size="23" font-weight="700" fill="#f87171">The 2 a.m. worry</text>
    <text x="88" y="238" font-size="19.5" fill="#cbd5e1">"svchost.exe is</text>
    <text x="88" y="268" font-size="19.5" fill="#cbd5e1">uploading packets."</text>
    <text x="88" y="330" font-size="16" fill="#94a3b8">Sounds alarming. Usually isn't.</text>

    <path d="M 384 262 L 384 250 L 404 262 L 384 274 Z" fill="#64748b"/>

    <rect x="424" y="136" width="340" height="252" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="456" y="184" font-size="23" font-weight="700" fill="#22d3ee">One row answers it</text>
    <circle cx="478" cy="216" r="8" fill="#fbbf24"/>
    <text x="496" y="223" font-size="18.5" font-weight="600" fill="#f1f5f9">svchost.exe</text>
    <g font-size="17" fill="#cbd5e1">
      <text x="456" y="262">→ Google LLC · AS15169</text>
      <text x="456" y="292">hosting: Google Update</text>
      <text x="456" y="322">launched by a scheduled task</text>
      <text x="456" y="352">— details one click away</text>
    </g>

    <path d="M 776 262 L 776 250 L 796 262 L 776 274 Z" fill="#64748b"/>

    <rect x="816" y="136" width="284" height="252" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="848" y="184" font-size="23" font-weight="700" fill="#34d399">No panic</text>
    <g font-size="19.5" fill="#cbd5e1">
      <text x="848" y="238">Chrome's updater,</text>
      <text x="848" y="268">talking to Google.</text>
    </g>
    <text x="848" y="316" font-size="16" fill="#94a3b8">No reinstall.</text>
    <text x="848" y="342" font-size="16" fill="#94a3b8">No midnight forums.</text>

    <text x="56" y="434" font-size="16.5" fill="#64748b">Real example, from this app's own development machine.</text>
    <text x="1064" y="434" font-size="15" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
